
name: Build Pool Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 4. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 5. Extract Android project
      - name: Prepare project
        run: |
          if [ ! -f PoolAssistantPro_Android_Source.zip ]; then
            echo "ERROR: Project ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p build-src
          unzip -q PoolAssistantPro_Android_Source.zip -d build-src

          if [ ! -f build-src/settings.gradle.kts ]; then
            echo "ERROR: Gradle project not found!"
            find build-src -maxdepth 3 -type f
            exit 1
          fi

      # 6. Build APK
      - name: Build APK
        run: |
          gradle \
            --no-daemon \
            -p build-src \
            assembleDebug

      # 7. Verify APK
      - name: Verify APK
        run: |
          APK="build-src/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          ls -lh "$APK"

      # 8. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoolAssistantPro-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
