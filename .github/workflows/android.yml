
name: Build Pool Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare project
        run: |
          unzip PoolAssistantPro_Android_Source.zip -d build-src

      - name: Build APK
        run: |
          cd build-src
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PoolAssistantPro-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
