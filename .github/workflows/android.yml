
name: Build Pool Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          mkdir -p build-src
          unzip -q PoolAssistantPro_Android_Source.zip -d build-src

          echo "Project files:"
          find build-src -maxdepth 4 -type f | head -100

          test -f build-src/settings.gradle.kts
          test -f build-src/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle --no-daemon -p build-src assembleDebug

      - name: Verify APK
        run: |
          test -s build-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolAssistantPro-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
